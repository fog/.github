# Runs the shared Ruby CI workflow maintained in fog/.github.
# See: .github/workflows/ci.yml in https://github.com/fog/.github
#
# Bump the version ref below to pick up matrix/action updates; Dependabot
# keeps it current once this file lands in a repository.

name: CI

on:
  push:
    branches: [ $default-branch ]
  pull_request:
    branches: [ $default-branch ]
  schedule:
    - cron: '0 0 * * 1' # At 00:00 on Monday.

permissions:
  contents: read

jobs:
  test:
    uses: fog/.github/.github/workflows/ci.yml@v1.6.0

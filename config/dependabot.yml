# Reference config for fog gems. This is a starting point to copy into a
# repository's .github/dependabot.yml -- Dependabot does not read org-level
# defaults from this repository.
version: 2
updates:
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      bundler:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      github-actions:
        patterns:
          - "*"
